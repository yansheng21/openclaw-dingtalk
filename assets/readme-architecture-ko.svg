<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadow" x="-30" y="-30" width="1260" height="820" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <filter id="glow" x="-40" y="-40" width="80" height="80" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  </g>

  <text x="64" y="82" fill="url(#title)" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="700">DingClaw 시스템 구조</text>
  <text x="64" y="118" fill="#475569" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20">OpenClaw 실행 커널 위에 제어 평면을 얹어 엔터프라이즈 메시징, 지식 동기화, 거버넌스를 운영합니다.</text>

  <rect x="64" y="156" width="1072" height="106" rx="24" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="96" y="196" fill="#1D4ED8" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">접속 계층</text>
  <g font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="700">
    <rect x="96" y="210" width="190" height="34" rx="12" fill="#FFFFFF"/><text x="118" y="233" fill="#0F172A">DingTalk 봇</text>
    <rect x="308" y="210" width="208" height="34" rx="12" fill="#FFFFFF"/><text x="347" y="233" fill="#0F172A">Control UI</text>
    <rect x="538" y="210" width="220" height="34" rx="12" fill="#FFFFFF"/><text x="575" y="233" fill="#0F172A">Desktop shell</text>
    <rect x="780" y="210" width="154" height="34" rx="12" fill="#FFFFFF"/><text x="833" y="233" fill="#0F172A">CLI</text>
    <rect x="956" y="210" width="148" height="34" rx="12" fill="#FFFFFF"/><text x="1005" y="233" fill="#0F172A">API</text>
  </g>

  <rect x="64" y="300" width="494" height="294" rx="24" fill="#ECFCCB" stroke="#84CC16"/>
  <text x="96" y="340" fill="#3F6212" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">제어 평면</text>
  <text x="96" y="370" fill="#4D7C0F" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18">누가 어떤 데이터, 도구, 모델, 승인 흐름으로 무엇을 할 수 있는지 결정합니다.</text>

  <g font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <rect x="96" y="402" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="129" y="438" fill="#1F2937" font-size="22" font-weight="700">Identity</text>
    <text x="116" y="461" fill="#475569" font-size="15">직원, 역할, 조직 매핑</text>

    <rect x="286" y="402" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="334" y="438" fill="#1F2937" font-size="22" font-weight="700">Policy</text>
    <text x="304" y="461" fill="#475569" font-size="15">라우팅, 도구, 데이터 범위</text>

    <rect x="96" y="492" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="119" y="528" fill="#1F2937" font-size="22" font-weight="700">Approval</text>
    <text x="111" y="551" fill="#475569" font-size="15">민감 작업 승인 흐름</text>

    <rect x="286" y="492" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="339" y="528" fill="#1F2937" font-size="22" font-weight="700">Audit</text>
    <text x="296" y="551" fill="#475569" font-size="15">이벤트, 추적, 증거 로그</text>

    <rect x="476" y="447" width="50" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="488" y="491" fill="#1F2937" font-size="22" font-weight="700">+</text>
    <text x="484" y="513" fill="#475569" font-size="12">bridge</text>
  </g>

  <rect x="642" y="300" width="494" height="294" rx="24" fill="#E0F2FE" stroke="#38BDF8"/>
  <text x="674" y="340" fill="#075985" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">실행 평면</text>
  <text x="674" y="370" fill="#0369A1" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18">OpenClaw 가 gateway, agents, tools, browser automation, agent 작업공간을 실제로 실행합니다.</text>

  <g font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <rect x="674" y="402" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="719" y="438" fill="#1F2937" font-size="22" font-weight="700">Gateway</text>
    <text x="696" y="461" fill="#475569" font-size="15">WS, HTTP, routing, sessions</text>

    <rect x="886" y="402" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="944" y="438" fill="#1F2937" font-size="22" font-weight="700">Agents</text>
    <text x="918" y="461" fill="#475569" font-size="15">identity, prompts, memory</text>

    <rect x="674" y="492" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="734" y="528" fill="#1F2937" font-size="22" font-weight="700">Tools</text>
    <text x="701" y="551" fill="#475569" font-size="15">API, browser, file, skills</text>

    <rect x="886" y="492" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="913" y="528" fill="#1F2937" font-size="22" font-weight="700">Knowledge</text>
    <text x="899" y="551" fill="#475569" font-size="15">agent 작업공간으로 동기화</text>
  </g>

  <rect x="64" y="632" width="1072" height="84" rx="24" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="96" y="670" fill="#334155" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">데이터 계층</text>
  <text x="96" y="698" fill="#64748B" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="17">PostgreSQL / Redis / object storage / agent workspaces / knowledge cache / logs / generated artifacts</text>

  <path d="M600 262V294" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <path d="M558 448H612" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M600 594V624" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M314 447C352 447 404 447 476 447" stroke="#65A30D" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M526 521C552 521 586 521 642 521" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#glow)">
    <circle r="5" fill="#22C55E">
      <animateMotion dur="5s" repeatCount="indefinite" path="M314 447C352 447 404 447 476 447"/>
    </circle>
    <circle r="5" fill="#0EA5E9">
      <animateMotion dur="5.8s" repeatCount="indefinite" path="M526 521C552 521 586 521 642 521"/>
    </circle>
    <circle r="5" fill="#F59E0B">
      <animateMotion dur="6s" repeatCount="indefinite" path="M600 262V294"/>
    </circle>
    <circle r="5" fill="#A855F7">
      <animateMotion dur="6.4s" repeatCount="indefinite" path="M600 594V624"/>
    </circle>
  </g>
</svg>
