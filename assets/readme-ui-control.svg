<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1490" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6EB"/>
      <stop offset="0.42" stop-color="#F4FBFF"/>
      <stop offset="1" stop-color="#EEF8F2"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F8FC"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0D2438"/>
      <stop offset="1" stop-color="#143A3A"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB56B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#34D399"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="0.75" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="160" y="50" width="1280" height="820" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="920" rx="40" fill="url(#bg)"/>
  <circle cx="1410" cy="124" r="174" fill="#FED7AA" fill-opacity="0.55">
    <animate attributeName="r" values="164;182;164" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="168" cy="784" r="146" fill="#D9F5EA" fill-opacity="0.85">
    <animate attributeName="r" values="136;154;136" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <rect x="220" y="96" width="1160" height="712" rx="30" fill="url(#shell)"/>
    <rect x="220" y="96" width="250" height="712" rx="30" fill="url(#sidebar)"/>
    <rect x="246" y="122" width="198" height="48" rx="18" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="278" y="153" fill="#F8FAFC" font-size="28" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">DingClaw</text>
    <text x="278" y="184" fill="#8FB6C9" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Chinese-first enterprise operator console</text>

    <g>
      <rect x="250" y="230" width="190" height="56" rx="18" fill="url(#orange)"/>
      <text x="286" y="265" fill="#FFFFFF" font-size="22" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">配置速览</text>
    </g>
    <g fill="#BBD5DE" font-size="18" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="286" y="336">代理</text>
      <text x="286" y="386">技能</text>
      <text x="286" y="436">知识库</text>
      <text x="286" y="486">接入实例</text>
      <text x="286" y="536">聊天</text>
      <text x="286" y="586">日志</text>
    </g>

    <rect x="514" y="126" width="822" height="84" rx="24" fill="#FFFFFF"/>
    <circle cx="564" cy="168" r="14" fill="#FB923C"/>
    <circle cx="608" cy="168" r="14" fill="#34D399"/>
    <circle cx="652" cy="168" r="14" fill="#60A5FA"/>
    <text x="714" y="176" fill="#22323F" font-size="30" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Config Overview / Agent Isolation / Knowledge Sync</text>

    <rect x="514" y="244" width="250" height="126" rx="24" fill="#FFF3E8"/>
    <text x="546" y="288" fill="#B45309" font-size="17" font-weight="700" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">模型提供商</text>
    <text x="546" y="344" fill="#1F2937" font-size="46" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">3</text>
    <text x="600" y="341" fill="#7C5B43" font-size="18" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">relay / openai / volcengine</text>

    <rect x="800" y="244" width="250" height="126" rx="24" fill="#ECFDF5"/>
    <text x="832" y="288" fill="#0F766E" font-size="17" font-weight="700" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">代理数量</text>
    <text x="832" y="344" fill="#1F2937" font-size="46" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">6</text>
    <text x="882" y="341" fill="#4D7C70" font-size="18" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">独立身份 / 独立工作区</text>

    <rect x="1086" y="244" width="250" height="126" rx="24" fill="#EFF6FF"/>
    <text x="1118" y="288" fill="#1D4ED8" font-size="17" font-weight="700" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">知识同步</text>
    <text x="1118" y="344" fill="#1F2937" font-size="46" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1,038</text>
    <text x="1234" y="341" fill="#5870A3" font-size="18" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">已同步文档</text>

    <rect x="514" y="404" width="822" height="364" rx="28" fill="#FFFFFF"/>
    <text x="548" y="454" fill="#22323F" font-size="26" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">模型路由管理</text>
    <text x="548" y="488" fill="#738290" font-size="17" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">以表格管理 provider / endpoint / model / reasoning / fallback，避免分散在多处配置。</text>

    <rect x="548" y="522" width="754" height="56" rx="16" fill="#F4F7FB"/>
    <g fill="#6B7280" font-size="16" font-weight="700" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="578" y="557">名称</text>
      <text x="724" y="557">API 请求地址</text>
      <text x="954" y="557">模型</text>
      <text x="1090" y="557">推理</text>
      <text x="1198" y="557">状态</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="5s" repeatCount="indefinite"/>
      <rect x="548" y="594" width="754" height="66" rx="18" fill="#FFF7ED"/>
      <text x="578" y="634" fill="#1F2937" font-size="18" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">OpenAI 主模型</text>
      <text x="724" y="634" fill="#64748B" font-size="16" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">https://relay.example.com/v1</text>
      <text x="954" y="634" fill="#1F2937" font-size="16" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">relay/gpt-5.4</text>
      <text x="1090" y="634" fill="#1F2937" font-size="16" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">xhigh</text>
      <rect x="1182" y="611" width="84" height="30" rx="15" fill="url(#orange)"/>
      <text x="1207" y="631" fill="#FFFFFF" font-size="14" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">主模型</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="5.6s" repeatCount="indefinite"/>
      <rect x="548" y="676" width="754" height="66" rx="18" fill="#F8FBFF"/>
      <text x="578" y="716" fill="#1F2937" font-size="18" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">备用推理模型</text>
      <text x="724" y="716" fill="#64748B" font-size="16" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">https://openrouter.example.ai/api</text>
      <text x="954" y="716" fill="#1F2937" font-size="16" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">openai/gpt-4.1</text>
      <text x="1090" y="716" fill="#1F2937" font-size="16" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">high</text>
      <rect x="1182" y="693" width="84" height="30" rx="15" fill="url(#green)"/>
      <text x="1200" y="713" fill="#FFFFFF" font-size="14" font-weight="800" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Fallback</text>
    </g>

    <rect x="548" y="758" width="754" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="548" y="758" width="180" height="8" rx="4" fill="url(#signal)">
      <animate attributeName="x" values="548;1090;548" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="width" values="120;220;120" dur="5.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
