<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadow" x="-30" y="-30" width="1260" height="820" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <filter id="glow" x="-40" y="-40" width="80" height="80" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  </g>

  <text x="64" y="82" fill="url(#title)" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700">DingClaw 系统形态</text>
  <text x="64" y="118" fill="#475569" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">围绕 OpenClaw 执行内核构建控制平面，面向企业消息接入、知识同步与治理运营。</text>

  <rect x="64" y="156" width="1072" height="106" rx="24" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="96" y="196" fill="#1D4ED8" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700">接入层</text>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700">
    <rect x="96" y="210" width="190" height="34" rx="12" fill="#FFFFFF"/><text x="116" y="233" fill="#0F172A">钉钉机器人</text>
    <rect x="308" y="210" width="208" height="34" rx="12" fill="#FFFFFF"/><text x="360" y="233" fill="#0F172A">控制台</text>
    <rect x="538" y="210" width="220" height="34" rx="12" fill="#FFFFFF"/><text x="600" y="233" fill="#0F172A">桌面壳</text>
    <rect x="780" y="210" width="154" height="34" rx="12" fill="#FFFFFF"/><text x="834" y="233" fill="#0F172A">CLI</text>
    <rect x="956" y="210" width="148" height="34" rx="12" fill="#FFFFFF"/><text x="1015" y="233" fill="#0F172A">API</text>
  </g>

  <rect x="64" y="300" width="494" height="294" rx="24" fill="#ECFCCB" stroke="#84CC16"/>
  <text x="96" y="340" fill="#3F6212" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700">控制平面</text>
  <text x="96" y="370" fill="#4D7C0F" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">决定谁可以在什么场景下调用什么模型、数据、工具与审批流程。</text>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="96" y="402" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="140" y="438" fill="#1F2937" font-size="22" font-weight="700">身份</text>
    <text x="114" y="461" fill="#475569" font-size="15">员工、角色、组织映射</text>

    <rect x="286" y="402" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="338" y="438" fill="#1F2937" font-size="22" font-weight="700">策略</text>
    <text x="309" y="461" fill="#475569" font-size="15">路由、工具边界、数据范围</text>

    <rect x="96" y="492" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="140" y="528" fill="#1F2937" font-size="22" font-weight="700">审批</text>
    <text x="111" y="551" fill="#475569" font-size="15">敏感动作工作流</text>

    <rect x="286" y="492" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="338" y="528" fill="#1F2937" font-size="22" font-weight="700">审计</text>
    <text x="300" y="551" fill="#475569" font-size="15">事件、链路、证据留痕</text>

    <rect x="476" y="447" width="50" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="488" y="491" fill="#1F2937" font-size="22" font-weight="700">+</text>
    <text x="481" y="513" fill="#475569" font-size="12">桥接</text>
  </g>

  <rect x="642" y="300" width="494" height="294" rx="24" fill="#E0F2FE" stroke="#38BDF8"/>
  <text x="674" y="340" fill="#075985" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700">执行平面</text>
  <text x="674" y="370" fill="#0369A1" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">OpenClaw 负责 Gateway、Agent、工具、浏览器能力与每个 Agent 的工作区。</text>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="674" y="402" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="729" y="438" fill="#1F2937" font-size="22" font-weight="700">Gateway</text>
    <text x="692" y="461" fill="#475569" font-size="15">WS、HTTP、路由、会话</text>

    <rect x="886" y="402" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="944" y="438" fill="#1F2937" font-size="22" font-weight="700">Agent</text>
    <text x="910" y="461" fill="#475569" font-size="15">身份、提示词、记忆</text>

    <rect x="674" y="492" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="741" y="528" fill="#1F2937" font-size="22" font-weight="700">工具</text>
    <text x="693" y="551" fill="#475569" font-size="15">API、浏览器、文件、技能</text>

    <rect x="886" y="492" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="921" y="528" fill="#1F2937" font-size="22" font-weight="700">知识同步</text>
    <text x="907" y="551" fill="#475569" font-size="15">写入 Agent 工作区</text>
  </g>

  <rect x="64" y="632" width="1072" height="84" rx="24" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="96" y="670" fill="#334155" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700">数据层</text>
  <text x="96" y="698" fill="#64748B" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">PostgreSQL / Redis / 对象存储 / Agent 工作区 / 知识缓存 / 日志 / 生成产物</text>

  <path d="M600 262V294" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <path d="M558 448H612" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M600 594V624" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M314 447C352 447 404 447 476 447" stroke="#65A30D" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M526 521C552 521 586 521 642 521" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#glow)">
    <circle r="5" fill="#22C55E">
      <animateMotion dur="5s" repeatCount="indefinite" path="M314 447C352 447 404 447 476 447"/>
    </circle>
    <circle r="5" fill="#0EA5E9">
      <animateMotion dur="5.8s" repeatCount="indefinite" path="M526 521C552 521 586 521 642 521"/>
    </circle>
    <circle r="5" fill="#F59E0B">
      <animateMotion dur="6s" repeatCount="indefinite" path="M600 262V294"/>
    </circle>
    <circle r="5" fill="#A855F7">
      <animateMotion dur="6.4s" repeatCount="indefinite" path="M600 594V624"/>
    </circle>
  </g>
</svg>
