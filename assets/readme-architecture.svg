<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="64" y="82" fill="url(#title)" font-family="Arial, sans-serif" font-size="34" font-weight="700">DingClaw system shape</text>
  <text x="64" y="118" fill="#475569" font-family="Arial, sans-serif" font-size="20">A control plane around the OpenClaw execution kernel, optimized for enterprise messaging and governance.</text>

  <rect x="64" y="156" width="1072" height="106" rx="24" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="96" y="196" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Access layer</text>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700">
    <rect x="96" y="210" width="190" height="34" rx="12" fill="#FFFFFF"/><text x="129" y="233" fill="#0F172A">DingTalk bots</text>
    <rect x="308" y="210" width="208" height="34" rx="12" fill="#FFFFFF"/><text x="344" y="233" fill="#0F172A">Control UI</text>
    <rect x="538" y="210" width="220" height="34" rx="12" fill="#FFFFFF"/><text x="583" y="233" fill="#0F172A">Desktop shell</text>
    <rect x="780" y="210" width="154" height="34" rx="12" fill="#FFFFFF"/><text x="818" y="233" fill="#0F172A">CLI</text>
    <rect x="956" y="210" width="148" height="34" rx="12" fill="#FFFFFF"/><text x="986" y="233" fill="#0F172A">APIs</text>
  </g>

  <rect x="64" y="300" width="494" height="294" rx="24" fill="#ECFCCB" stroke="#84CC16"/>
  <text x="96" y="340" fill="#3F6212" font-family="Arial, sans-serif" font-size="24" font-weight="700">Control plane</text>
  <text x="96" y="370" fill="#4D7C0F" font-family="Arial, sans-serif" font-size="18">Decides who can do what, with which data, tools, model, and approval rules.</text>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="402" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="129" y="438" fill="#1F2937" font-size="22" font-weight="700">Identity</text>
    <text x="111" y="461" fill="#475569" font-size="15">employee, role, org mapping</text>

    <rect x="286" y="402" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="332" y="438" fill="#1F2937" font-size="22" font-weight="700">Policy</text>
    <text x="305" y="461" fill="#475569" font-size="15">routing, tool guard, scope</text>

    <rect x="96" y="492" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="122" y="528" fill="#1F2937" font-size="22" font-weight="700">Approval</text>
    <text x="111" y="551" fill="#475569" font-size="15">sensitive action workflow</text>

    <rect x="286" y="492" width="174" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="338" y="528" fill="#1F2937" font-size="22" font-weight="700">Audit</text>
    <text x="300" y="551" fill="#475569" font-size="15">event, trace, evidence log</text>

    <rect x="476" y="447" width="50" height="74" rx="18" fill="#FFFFFF" stroke="#BEF264"/>
    <text x="488" y="491" fill="#1F2937" font-size="22" font-weight="700">+</text>
    <text x="481" y="513" fill="#475569" font-size="12">relay</text>
  </g>

  <rect x="642" y="300" width="494" height="294" rx="24" fill="#E0F2FE" stroke="#38BDF8"/>
  <text x="674" y="340" fill="#075985" font-family="Arial, sans-serif" font-size="24" font-weight="700">Execution plane</text>
  <text x="674" y="370" fill="#0369A1" font-family="Arial, sans-serif" font-size="18">OpenClaw runs the gateway, agents, tools, browser automation, and per-agent workspaces.</text>

  <g font-family="Arial, sans-serif">
    <rect x="674" y="402" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="719" y="438" fill="#1F2937" font-size="22" font-weight="700">Gateway</text>
    <text x="691" y="461" fill="#475569" font-size="15">WS, HTTP, routing, sessions</text>

    <rect x="886" y="402" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="943" y="438" fill="#1F2937" font-size="22" font-weight="700">Agents</text>
    <text x="912" y="461" fill="#475569" font-size="15">identity, prompts, memory</text>

    <rect x="674" y="492" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="734" y="528" fill="#1F2937" font-size="22" font-weight="700">Tools</text>
    <text x="699" y="551" fill="#475569" font-size="15">API, browser, file, skills</text>

    <rect x="886" y="492" width="188" height="74" rx="18" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="923" y="528" fill="#1F2937" font-size="22" font-weight="700">Knowledge</text>
    <text x="907" y="551" fill="#475569" font-size="15">sync into agent workspace</text>
  </g>

  <rect x="64" y="632" width="1072" height="84" rx="24" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="96" y="670" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700">Data layer</text>
  <text x="96" y="698" fill="#64748B" font-family="Arial, sans-serif" font-size="17">PostgreSQL / Redis / object storage / agent workspaces / knowledge cache / logs / generated artifacts</text>

  <path d="M600 262V294" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <path d="M558 448H612" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 594V624" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <path d="M314 447C352 447 404 447 476 447" stroke="#65A30D" stroke-width="4" stroke-linecap="round"/>
  <path d="M526 521C552 521 586 521 642 521" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
  <path d="M862 447C902 447 926 447 886 447" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
  <path d="M862 521C894 521 916 521 886 521" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
</svg>
